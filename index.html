<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Central de Relatórios</title>
    <link rel="shortcut icon" href="image/Custom-reports_37139.ico" type="image/x-icon">
    <link rel="stylesheet" href="css/estilo.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
</head>

<body>
    <header>
        <div class="cabecalho">
            <div class="caixa-cabecalho">
                <h1>Central de Relatórios - CR</h1>
            </div>
        </div>
    </header>

    <main>
        <div class="central">
            <div class="caixa-central">
                <div class="caixa-titulo">
                    <h1>Formulário de informações </h1>
                </div>

                <div class="caixa-informacoes">
                    <label for="Funcionarios">Funcionario <i class="bi bi-person-fill"></i></label><br>
                    <select name="funcinarios" class="Funcionarios">
                        <option>Nenhum</option>
                        <option>Roberto Silva</option>
                        <option>Aline Oliveira</option>
                        <option>Marina Beltrão</option>
                        <option>Kaio Almeida</option>
                        <option>Mariano Brito</option>
                    </select><br>

                    <label for="valor">Valor semanal <i class="bi bi-piggy-bank-fill"></i></label><br>
                    <input type="text" placeholder="Digite aqui" id="valor"><br>

                    <label for="data">Data de Relatório <i class="bi bi-calendar-date-fill"></i></label><br>
                    <input type="date" id="data">
                </div>

                <div class="btn-registrar">
                    <button type="button" id="btn-registrar" onclick="registrarInformacoes()">Registrar</button>
                </div>
            </div>

            <div class="tabela">
                <table border="1">
                    <thead>
                        <tr>
                            <th>Funcionário</th>
                            <th>Valor</th>
                            <th>Data de Registro</th>
                        </tr>
                    </thead>
                    <tbody class="tabela-informacoes">
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <script src="js/script.js"></script>
</body>
</html>
