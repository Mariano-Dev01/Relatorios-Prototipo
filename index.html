<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Central de Relatórios</title>
    <link rel="shortcut icon" href="image/Custom-reports_37139.ico" type="image/x-icon">
    <link rel="stylesheet" href="css/estilo.css">

    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
</head>

<body>
    <header>
        <div class="cabecalho">
            <div class="caixa-cabecalho">
                <div>
                    <span class="subtitulo">SISTEMA DE GESTÃO</span>
                    <h1>Central de Relatórios</h1>
                </div>

                <div class="icone-header">
                    <i class="bi bi-bar-chart-fill"></i>
                </div>
            </div>
        </div>
    </header>

    <main>
        <div class="central">

            <!-- FORMULÁRIO -->
            <section class="caixa-central">

                <div class="caixa-titulo">
                    <div class="icone-titulo">
                        <i class="bi bi-file-earmark-plus-fill"></i>
                    </div>

                    <div>
                        <span>NOVO REGISTRO</span>
                        <h2>Informações</h2>
                    </div>
                </div>

                <div class="caixa-informacoes">

                    <label for="Funcionarios">
                        Funcionário
                        <i class="bi bi-person-fill"></i>
                    </label>

                    <select name="funcionarios" class="Funcionarios" id="Funcionarios">
                        <option value="">Selecione um funcionário</option>
                        <option value="Roberto Silva">Roberto Silva</option>
                        <option value="Aline Oliveira">Aline Oliveira</option>
                        <option value="Marina Beltrão">Marina Beltrão</option>
                        <option value="Kaio Almeida">Kaio Almeida</option>
                        <option value="Mariano Brito">Mariano Brito</option>
                    </select>


                    <label for="valor">
                        Valor semanal
                        <i class="bi bi-cash-stack"></i>
                    </label>

                    <input
                        type="number"
                        placeholder="Digite o valor"
                        id="valor"
                        min="0"
                        step="0.01"
                    >


                    <label for="data">
                        Data do relatório
                        <i class="bi bi-calendar-date-fill"></i>
                    </label>

                    <input type="date" id="data">
                </div>

                <div class="btn-registrar">

                    <button type="button" id="btn-registrar" onclick="registrarInformacoes()">

                        <i class="bi bi-plus-circle-fill"></i>

                        Registrar

                    </button>

                </div>

            </section>


            <!-- ÁREA DOS RELATÓRIOS -->
            <section class="area-relatorios">

                <div class="topo-tabela">

                    <div>
                        <span>HISTÓRICO</span>
                        <h2>Relatórios registrados</h2>
                    </div>

                    <div class="total">

                        <span>Total</span>

                        <strong id="total-valores">
                            R$ 0,00
                        </strong>

                    </div>

                </div>


                <div class="tabela">

                    <table>

                        <thead>

                            <tr>
                                <th>Funcionário</th>
                                <th>Valor</th>
                                <th>Data</th>
                                <th>Ação</th>
                            </tr>

                        </thead>

                        <tbody class="tabela-informacoes">
                        </tbody>

                    </table>

                    <div class="sem-registros" id="sem-registros">

                        <i class="bi bi-inbox"></i>

                        <p>Nenhum relatório registrado.</p>

                    </div>

                </div>

            </section>

        </div>
    </main>

    <script src="js/script.js"></script>
</body>
</html>
